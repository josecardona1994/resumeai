[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "chromium", "nss", "nspr", "atk", "cups", "dbus", "expat", "libdrm", "libxkbcommon", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "mesa", "gtk3", "pango", "cairo", "alsa-lib"]

[phases.install]
cmds = ["python3 -m pip install -r requirements.txt", "python3 -m playwright install chromium --with-deps"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
